name: ecoclimapsg-test-2025-2025-6h-v1

description: Physiography fields from surfex and topography descriptors

attribution: metno/surfex

licence: CC-BY-4.0

dates:
  start: '1979-01-01T00:00:00'
  end: '2027-01-01T00:00:00'
  frequency: 8760h

build:
  group_by: 4

output:
  chunking: {dates: 1}


input:
  repeated-dates:
    mode: constant
    source:
      join:
        - netcdf:
            path: "data/output_data/fractions_n320.nc"
        - pipe:
          - netcdf:
              path: "data/output_data/tree_height_n320.nc"
              param: ["h_tree_mean"]
          - rename:
              param: "treeheight"
        - pipe:
          - netcdf:
              path: "data/output_data/std_oro_n320_100.nc"
              param: ["std_oro_100km"]
          - rename:
              param: "sdor_100"
        - pipe:
          - netcdf:
              path: "data/output_data/std_oro_n320_30.nc"
              param: ["std_oro_30km"]
          - rename:
              param: "sdor_30"
        - pipe:
          - netcdf:
              path: "data/output_data/slope_oro_n320_100.nc"
              param: ["orography_slope_x", "orography_slope_y"]
          - rename:
              param:
                  orography_slope_x: "slor_x_100"
                  orography_slope_y: "slor_y_100"
        - pipe:
          - netcdf:
              path: "data/output_data/slope_oro_n320_30.nc"
              param: ["orography_slope_x", "orography_slope_y"]
          - rename:
              param:
                  orography_slope_x: "slor_x_30"
                  orography_slope_y: "slor_y_30"  
      
statistics:
  allow_nans: false

